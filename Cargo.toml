[package]
name = "rusted-email"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Email library for Rust services, with SMTP and mock providers and Handlebars templates"
license = "MIT OR Apache-2.0"
authors = ["PT Alpha Global Inovasi", "Alindra Putra"]
repository = "https://github.com/Alpha-Global-Inovasi/rusted-email"
readme = "README.md"
keywords = ["email", "smtp", "handlebars", "mail"]
categories = ["email"]
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["rustls-tls"]
# TLS backend for SMTP connections. Enable exactly one.
rustls-tls = ["lettre/tokio1-rustls", "lettre/aws-lc-rs", "lettre/rustls-platform-verifier"]
native-tls = ["lettre/tokio1-native-tls"]

[dependencies]
async-trait = "0.1.92"
handlebars = "6.4.4"
lettre = { version = "0.11.24", default-features = false, features = [
    "builder",
    "hostname",
    "pool",
    "smtp-transport",
    "tokio1",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }
